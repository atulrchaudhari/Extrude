<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrude - Launching Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        .brand-name {
            font-size: 3.5rem;
            font-weight: 700;
            color: #FF6B35; /* Vibrant orange matching the image */
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .status-text {
            font-size: 1.25rem;
            color: #555555;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Decorative bottom-right corner shape based on the scribble */
        .corner-accent {
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 300px;
            height: 150px;
            background-color: #FF4D4D; /* Reddish accent color */
            transform: rotate(-10deg);
            border-top-left-radius: 50% 100%;
            opacity: 0.9;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .brand-name {
                font-size: 2.5rem;
            }
            .status-text {
                font-size: 1rem;
            }
            .corner-accent {
                width: 200px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="brand-name">Extrude</h1>
        <p class="status-text">launching soon</p>
    </div>

    <div class="corner-accent"></div>

</body>
</html>
